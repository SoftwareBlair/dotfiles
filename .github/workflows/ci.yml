name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: .scripts/tui/go.sum
      - name: TUI tests + smokes
        run: bash .scripts/tui/test.sh
      - name: Validate profiles
        run: bash .scripts/validate-profiles.sh
